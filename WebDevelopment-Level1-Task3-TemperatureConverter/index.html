<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Temperature-convertor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,500&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
</head>

<body>

    <div class="stage" id="stage">
        <div class="panel" id="panel">
            <header>
                <h1>Temperature Gauge</h1>
                <p class="subtitle">Adjust any reading — the other two follow</p>
            </header>

            <div class="instrument">
                <div class="thermo-wrap">
                    <div class="scale">
                        <span>150</span>
                        <span>100</span>
                        <span>50</span>
                        <span>0</span>
                        <span>-40</span>
                    </div>
                    <div>
                        <div class="tube-frame">
                            <div class="mercury" id="mercury"></div>
                        </div>
                        <div class="bulb-frame">
                            <div class="bulb" id="bulb"></div>
                        </div>
                    </div>
                </div>

                <div class="readouts">
                    <div class="gauge" id="gauge-c">
                        <div class="gauge-inner">
                            <span class="unit">°C<small>Celsius</small></span>
                            <input class="readout" type="number" step="any" id="celsius" placeholder="0" />
                        </div>
                    </div>
                    <div class="gauge" id="gauge-f">
                        <div class="gauge-inner">
                            <span class="unit">°F<small>Fahrenheit</small></span>
                            <input class="readout" type="number" step="any" id="fahrenheit" placeholder="0" />
                        </div>
                    </div>
                    <div class="gauge" id="gauge-k">
                        <div class="gauge-inner">
                            <span class="unit">K<small>Kelvin</small></span>
                            <input class="readout" type="number" step="any" id="kelvin" placeholder="0" />
                        </div>
                    </div>
                </div>
            </div>

            <footer>0°C = 32°F = 273.15K</footer>
        </div>
    </div>

    <script src="index.js"></script>
</body>

</html>
